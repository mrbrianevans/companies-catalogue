name: Lakehouse load jobs
on:
  schedule:
    - cron: "0 3 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

env:
  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT || vars.S3_ENDPOINT }}
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  S3_REGION: ${{ secrets.S3_REGION || vars.S3_REGION }}
  STREAM_KEY: ${{ secrets.STREAM_KEY }}
  PGPASSWORD: ${{ secrets.PGPASSWORD }}
  PGHOST: ${{ secrets.PGHOST }}
  PGUSER: ${{ secrets.PGUSER }}
  PGPORT: ${{ vars.PGPORT }}

concurrency: lakehouse

jobs:
  capture-streams:
    name: Capture event streams
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        stream:
          [
            "charges",
            "officers",
            "persons-with-significant-control",
            "persons-with-significant-control-statements",
            "filings",
            "companies",
            "insolvency-cases",
            "company-exemptions",
            "disqualified-officers",
          ]
        branch: [master, dev]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: bun captureStream.ts ${{ matrix.stream }}
        working-directory: eventCapture
        env:
          SINK_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-sink' || 'dev-companies-stream-sink' }}
          STREAM_BASE_URL: "stream.companieshouse.gov.uk"

  load-lakehouse:
    needs: ["capture-streams", "capture-xbrl-csv"]
    name: Load lakehouse
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        stream:
          [
            "charges",
            "officers",
            "persons-with-significant-control",
            "persons-with-significant-control-statements",
            "filings",
            "companies",
            "insolvency-cases",
            "company-exemptions",
            "disqualified-officers",
            "xbrl",
          ]
        branch: [master, dev]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: bun lakehouse.ts ${{ matrix.stream }}
        working-directory: lakehouse
        env:
          SINK_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-sink' || 'dev-companies-stream-sink' }}
          LAKE_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-lake' || 'dev-companies-stream-lake' }}
          PGDATABASE: ${{ matrix.branch == 'master' && 'cc_prod' || 'cc_dev' }}

  export-snapshots:
    needs: ["load-lakehouse", "capture-charity"]
    name: Export snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        stream:
          [
            "charges",
            "officers",
            "persons-with-significant-control",
            "persons-with-significant-control-statements",
            "filings",
            "companies",
            "insolvency-cases",
            "company-exemptions",
            "disqualified-officers",
            "charity",
          ]
        branch: [master, dev]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: bun snapshots.ts ${{ matrix.stream }}
        working-directory: lakehouse
        env:
          LAKE_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-lake' || 'dev-companies-stream-lake' }}
          SNAPSHOT_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-snapshots' || 'dev-companies-stream-snapshots' }}
          PRIVATE_SNAPSHOT_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-snapshots-private' || 'dev-companies-stream-snapshots-private' }}
          PGDATABASE: ${{ matrix.branch == 'master' && 'cc_prod' || 'cc_dev' }}
  capture-xbrl-csv:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        branch: [master, dev]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Install ch-xbrl
        run: |
          curl -fsSL https://github.com/mrbrianevans/ch-xbrl/releases/download/v0.3.0/ch-xbrl_v0.3.0_linux_amd64.tar.gz \
            | sudo tar -xzf - -C /usr/local/bin ch-xbrl
          sudo chmod +x /usr/local/bin/ch-xbrl
          ch-xbrl -V

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: bun index.ts
        working-directory: xbrl
        env:
          SINK_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-sink' || 'dev-companies-stream-sink' }}

  capture-charity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        branch: [master, dev]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: bun ingest.ts
        working-directory: charity
        env:
          SINK_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-sink' || 'dev-companies-stream-sink' }}
          LAKE_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-lake' || 'dev-companies-stream-lake' }}
          PGDATABASE: ${{ matrix.branch == 'master' && 'cc_prod' || 'cc_dev' }}

  clean-lakehouse:
    needs: export-snapshots # only clean if everything else succeeded
    name: Clean up lakehouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        branch: [master, dev]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: bun checkpoint.ts
        working-directory: lakehouse
        env:
          LAKE_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-lake' || 'dev-companies-stream-lake' }}
          PGDATABASE: ${{ matrix.branch == 'master' && 'cc_prod' || 'cc_dev' }}
