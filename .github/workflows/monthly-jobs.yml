name: Monthly load jobs
on:
  schedule:
    - cron: "0 4 2 * *"
  workflow_dispatch:

env:
  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT || vars.S3_ENDPOINT }}
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  S3_REGION: ${{ secrets.S3_REGION || vars.S3_REGION }}
  STREAM_KEY: ${{ secrets.STREAM_KEY }}
  PGPASSWORD: ${{ secrets.PGPASSWORD }}
  PGHOST: ${{ secrets.PGHOST }}
  PGUSER: ${{ secrets.PGUSER }}
  PGPORT: ${{ vars.PGPORT }}

concurrency: lakehouse

jobs:
  capture-xbrl-csv:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', github.ref_name) || '["master","dev"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Install ch-xbrl
        env:
          CH_XBRL_VERSION: ${{ matrix.branch == 'master' && 'v0.4.6' || 'v0.4.6' }}
        run: |
          base="https://github.com/mrbrianevans/ch-xbrl/releases/download/${CH_XBRL_VERSION}"
          asset="ch-xbrl_${CH_XBRL_VERSION}_linux_amd64"
          tmp=$(mktemp -d)
          curl -fsSL -o "$tmp/$asset" "$base/$asset"
          curl -fsSL -o "$tmp/SHA256SUMS" "$base/SHA256SUMS"
          (cd "$tmp" && grep " ${asset}\$" SHA256SUMS | sha256sum -c -)
          sudo install -m 0755 "$tmp/$asset" /usr/local/bin/ch-xbrl
          ch-xbrl -V

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: bun index.ts
        working-directory: xbrl
        env:
          SINK_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-sink' || 'dev-companies-stream-sink' }}

  xbrl-snapshot:
    name: XBRL snapshot
    needs: ["capture-xbrl-csv"]
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        branch: [master, dev]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: bun lakehouse.ts xbrl
        working-directory: lakehouse
        env:
          SINK_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-sink' || 'dev-companies-stream-sink' }}
          LAKE_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-lake' || 'dev-companies-stream-lake' }}
          PGDATABASE: ${{ matrix.branch == 'master' && 'cc_prod' || 'cc_dev' }}

      - run: bun snapshots.ts xbrl
        working-directory: lakehouse
        env:
          LAKE_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-lake' || 'dev-companies-stream-lake' }}
          SNAPSHOT_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-snapshots' || 'dev-companies-stream-snapshots' }}
          PRIVATE_SNAPSHOT_BUCKET: ${{ matrix.branch == 'master' && 'companies-stream-snapshots-private' || 'dev-companies-stream-snapshots-private' }}
          PGDATABASE: ${{ matrix.branch == 'master' && 'cc_prod' || 'cc_dev' }}
